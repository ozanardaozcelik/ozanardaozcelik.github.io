<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Woven Cloth · Washi Noren · İletişim</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #090705; font-family: 'DM Mono', monospace; user-select: none;
  }
  #cloth { display: block; width: 100%; height: 100%; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(80% 74% at 50% 44%, transparent 46%, rgba(8,6,4,.88) 100%);
  }

  /* HUD Overlay on Washi Noren */
  .noren-hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 24px 32px; z-index: 10;
  }

  .noren-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: auto;
  }
  .noren-title-tag {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(243, 236, 224, 0.65); display: flex; align-items: center; gap: 8px;
    background: rgba(18, 14, 10, 0.65); padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(243, 236, 224, 0.12); backdrop-filter: blur(8px);
  }
  .noren-title-tag .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #00e5ff;
    box-shadow: 0 0 8px #00e5ff;
  }

  .noren-hint {
    font-size: 10px; letter-spacing: 0.12em; color: rgba(243, 236, 224, 0.45);
    background: rgba(18, 14, 10, 0.65); padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(243, 236, 224, 0.08); backdrop-filter: blur(8px);
  }

  /* Interactive Channel Pills matching the 3 Panels */
  .noren-channels {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;
    max-width: 960px; margin: 0 auto; width: 100%; pointer-events: auto;
    margin-bottom: 8px;
  }
  .channel-pill {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 12px 16px; border-radius: 12px; text-decoration: none;
    background: rgba(18, 15, 12, 0.72); border: 1px solid rgba(243, 236, 224, 0.12);
    backdrop-filter: blur(12px); color: #f3ece0; transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer; text-align: center;
  }
  .channel-pill:hover, .channel-pill.is-hovered {
    background: rgba(32, 61, 94, 0.85); border-color: rgba(0, 229, 255, 0.55);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(0, 229, 255, 0.25);
    transform: translateY(-3px);
  }
  .channel-pill.is-hovered-amber {
    background: rgba(80, 42, 14, 0.85); border-color: rgba(255, 153, 0, 0.6);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(255, 153, 0, 0.25);
    transform: translateY(-3px);
  }
  .channel-pill.is-hovered-green {
    background: rgba(14, 56, 32, 0.85); border-color: rgba(0, 255, 136, 0.6);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(0, 255, 136, 0.25);
    transform: translateY(-3px);
  }
  .ch-meta {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(243, 236, 224, 0.5); margin-bottom: 2px;
  }
  .ch-title {
    font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px;
  }
  .ch-action {
    font-size: 10px; color: rgba(243, 236, 224, 0.6); margin-top: 3px;
    letter-spacing: 0.04em;
  }

  @media (max-width: 768px) {
    .noren-hud { padding: 14px 16px; }
    .noren-header { gap: 8px; flex-wrap: wrap; }
    .noren-title-tag { font-size: 9.5px; padding: 4px 10px; }
    .noren-hint { font-size: 9px; padding: 4px 10px; }
    .noren-channels { gap: 8px; margin-bottom: 4px; }
    .channel-pill { padding: 8px 6px; }
    .ch-title { font-size: 11px; }
    .ch-meta, .ch-action { display: none; }
  }

  @media (max-width: 480px) {
    .noren-hud { padding: 10px 12px; }
    .noren-title-tag { font-size: 8.5px; padding: 3px 8px; }
    .noren-hint { font-size: 8px; padding: 3px 8px; }
    .noren-channels { gap: 6px; margin-bottom: 2px; }
    .channel-pill { padding: 6px 4px; border-radius: 8px; }
    .ch-title { font-size: 9.5px; }
  }

  html[data-lang="tr"] .lang-en { display: none !important; }
  html[data-lang="en"] .lang-tr { display: none !important; }
</style>
</head>
<body>
<canvas id="cloth"></canvas>
<div id="vignette"></div>

<div class="noren-hud">
  <div class="noren-header">
    <div class="noren-title-tag">
      <span class="dot"></span>
      <span class="lang-tr">YENİ FIRSATLARA VE PROJELERE AÇIK</span>
      <span class="lang-en">OPEN TO NEW OPPORTUNITIES &amp; PROJECTS</span>
    </div>
    <div class="noren-hint">
      <span class="lang-tr">✦ İSTANBUL, TÜRKİYE</span>
      <span class="lang-en">✦ ISTANBUL, TURKEY</span>
    </div>
  </div>

  <div class="noren-channels">
    <a href="https://www.linkedin.com/in/ozanardaozcelik/" target="_blank" rel="noopener noreferrer" class="channel-pill" id="pillLinkedin">
      <span class="ch-meta">CH 01 // 接続</span>
      <span class="ch-title">LINKEDIN ↗</span>
      <span class="ch-action">
        <span class="lang-tr">Ağa Bağlan</span>
        <span class="lang-en">Connect</span>
      </span>
    </a>
    <a href="mailto:ozan.a.ozcelik@gmail.com" class="channel-pill" id="pillEmail">
      <span class="ch-meta">CH 02 // 連絡</span>
      <span class="ch-title">
        <span class="lang-tr">E-POSTA ↗</span>
        <span class="lang-en">EMAIL ↗</span>
      </span>
      <span class="ch-action">
        <span class="lang-tr">E-posta Gönder</span>

      </span>
    </a>
    <a href="https://github.com/ozanardaozcelik" target="_blank" rel="noopener noreferrer" class="channel-pill" id="pillGithub">
      <span class="ch-meta">CH 03 // 開発</span>
      <span class="ch-title">GITHUB ↗</span>
      <span class="ch-action">
        <span class="lang-tr">Repoları İncele</span>
        <span class="lang-en">View Repos</span>

    </a>
  </div>
</div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const canvas = document.getElementById('cloth');
  if (!window.THREE) return;

  const TW = 1500, TH = 980;
  const PANELS = 3;
  const BAND = 0.15; // Uncut sleeve through which rod runs
  const SLIT_U = [1 / 3, 2 / 3];

  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }

  function surface(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return { canvas: c, ctx: c.getContext('2d', { willReadFrequently: true }) };
  }

  function roundRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  /* ------------------------------------------------------------- deckle -- */
  const deckleRand = rng(20260826);
  const deckleLow = new Float32Array(TW);
  {
    const control = [];
    for (let i = 0; i <= 24; i++) control.push(deckleRand());
    for (let x = 0; x < TW; x++) {
      const f = (x / TW) * 24;
      const i = Math.floor(f), t = f - i;
      const smooth = t * t * (3 - 2 * t);
      const a = control[i], b = control[Math.min(24, i + 1)];
      const base = a + (b - a) * smooth;
      const fine = Math.sin(x * 0.19) * 0.16 + Math.sin(x * 0.061 + 1.7) * 0.24;
      deckleLow[x] = TH - 14 - (base * 26 + fine * 12);
    }
  }

  function makeAlphaMask() {
    const s = surface(TW, TH), x = s.ctx;
    x.fillStyle = '#fff'; x.fillRect(0, 0, TW, TH);
    x.fillStyle = '#000';

    const slitW = 22, bandPx = TH * BAND;
    SLIT_U.forEach((u) => x.fillRect(u * TW - slitW / 2, bandPx, slitW, TH - bandPx));

    x.beginPath();
    x.moveTo(0, TH);
    for (let px = 0; px < TW; px++) x.lineTo(px, deckleLow[px]);
    x.lineTo(TW, TH);
    x.closePath();
    x.fill();

    const side = rng(771);
    for (let e = 0; e < 2; e++) {
      x.beginPath();
      x.moveTo(e ? TW : 0, 0);
      for (let py = 0; py <= TH; py += 6) {
        const w = 6 + side() * 9;
        x.lineTo(e ? TW - w : w, py);
      }
      x.lineTo(e ? TW : 0, TH);
      x.closePath();
      x.fill();
    }
    return s;
  }

  /* ------------------------------------------------ Katazome Resist Crests */
  function drawLinkedInCrest(x, cx, cy, R) {
    x.save();
    // Double circular border
    x.strokeStyle = '#f3ece0';
    x.lineWidth = R * 0.08;
    x.beginPath(); x.arc(cx, cy, R * 0.96, 0, Math.PI * 2); x.stroke();
    x.lineWidth = R * 0.04;
    x.beginPath(); x.arc(cx, cy, R * 0.85, 0, Math.PI * 2); x.stroke();

    // Inner clipped field
    x.beginPath(); x.arc(cx, cy, R * 0.78, 0, Math.PI * 2); x.clip();
    x.fillStyle = '#f3ece0';
    const bw = R * 0.98, bh = R * 0.98;
    roundRect(x, cx - bw/2, cy - bh/2, bw, bh, 14);
    x.fill();

    // Indigo cutouts for 'in' monogram
    x.fillStyle = '#1c3757';
    const dotR = R * 0.11;
    x.beginPath(); x.arc(cx - R * 0.24, cy - R * 0.24, dotR, 0, Math.PI * 2); x.fill();
    x.fillRect(cx - R * 0.32, cy - R * 0.08, R * 0.16, R * 0.44);

    // 'n' stem
    x.fillRect(cx - R * 0.06, cy - R * 0.08, R * 0.16, R * 0.44);
    x.beginPath();
    x.arc(cx + R * 0.18, cy + R * 0.04, R * 0.16, Math.PI, 0);
    x.lineTo(cx + R * 0.34, cy + R * 0.36);
    x.lineTo(cx + R * 0.18, cy + R * 0.36);
    x.lineTo(cx + R * 0.18, cy + R * 0.08);
    x.arc(cx + R * 0.18, cy + R * 0.08, R * 0.04, 0, Math.PI, true);
    x.closePath();
    x.fill();
    x.fillRect(cx + R * 0.18, cy, R * 0.16, R * 0.36);
    x.restore();
  }

  function drawMailCrest(x, cx, cy, R) {
    x.save();
    x.strokeStyle = '#f3ece0';
    x.lineWidth = R * 0.08;
    x.beginPath(); x.arc(cx, cy, R * 0.96, 0, Math.PI * 2); x.stroke();
    x.lineWidth = R * 0.04;
    x.beginPath(); x.arc(cx, cy, R * 0.85, 0, Math.PI * 2); x.stroke();

    x.beginPath(); x.arc(cx, cy, R * 0.78, 0, Math.PI * 2); x.clip();
    x.fillStyle = '#f3ece0';
    const ew = R * 1.15, eh = R * 0.82;
    roundRect(x, cx - ew/2, cy - eh/2, ew, eh, 12);
    x.fill();

    // Geometric envelope cutouts in indigo
    x.strokeStyle = '#1c3757';
    x.lineWidth = 6;
    x.lineJoin = 'round';
    x.beginPath();
    x.moveTo(cx - ew/2 + 8, cy - eh/2 + 6);
    x.lineTo(cx, cy + eh * 0.12);
    x.lineTo(cx + ew/2 - 8, cy - eh/2 + 6);
    x.stroke();

    x.beginPath();
    x.moveTo(cx - ew/2 + 8, cy + eh/2 - 6);
    x.lineTo(cx - ew * 0.16, cy + eh * 0.04);
    x.moveTo(cx + ew/2 - 8, cy + eh/2 - 6);
    x.lineTo(cx + ew * 0.16, cy + eh * 0.04);
    x.stroke();
    x.restore();
  }

  function drawGitHubCrest(x, cx, cy, R) {
    x.save();
    x.strokeStyle = '#f3ece0';
    x.lineWidth = R * 0.08;
    x.beginPath(); x.arc(cx, cy, R * 0.96, 0, Math.PI * 2); x.stroke();
    x.lineWidth = R * 0.04;
    x.beginPath(); x.arc(cx, cy, R * 0.85, 0, Math.PI * 2); x.stroke();

    x.beginPath(); x.arc(cx, cy, R * 0.78, 0, Math.PI * 2); x.clip();
    x.fillStyle = '#f3ece0';
    const headR = R * 0.44;
    x.beginPath(); x.arc(cx, cy + headR * 0.16, headR, 0, Math.PI * 2); x.fill();

    // Ears
    x.beginPath();
    x.moveTo(cx - headR * 0.76, cy - headR * 0.18);
    x.lineTo(cx - headR * 0.88, cy - headR * 0.88);
    x.lineTo(cx - headR * 0.22, cy - headR * 0.65);
    x.closePath();
    x.fill();

    x.beginPath();
    x.moveTo(cx + headR * 0.76, cy - headR * 0.18);
    x.lineTo(cx + headR * 0.88, cy - headR * 0.88);
    x.lineTo(cx + headR * 0.22, cy - headR * 0.65);
    x.closePath();
    x.fill();

    // Code glyphs inside: < / >
    x.strokeStyle = '#1c3757';
    x.lineWidth = 5;
    x.lineCap = 'round';
    x.beginPath();
    x.moveTo(cx - headR * 0.4, cy + headR * 0.05);
    x.lineTo(cx - headR * 0.6, cy + headR * 0.22);
    x.lineTo(cx - headR * 0.4, cy + headR * 0.40);

    x.moveTo(cx + headR * 0.4, cy + headR * 0.05);
    x.lineTo(cx + headR * 0.6, cy + headR * 0.22);
    x.lineTo(cx + headR * 0.4, cy + headR * 0.40);

    x.moveTo(cx + headR * 0.12, cy + headR * 0.02);
    x.lineTo(cx - headR * 0.12, cy + headR * 0.44);
    x.stroke();
    x.restore();
  }

  function verticalWord(x, word, cx, top, size, step) {
    x.font = 'bold ' + size + 'px Georgia, "Times New Roman", serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for (let i = 0; i < word.length; i++) x.fillText(word[i], cx, top + i * step);
  }

  function drawHandleBadge(x, text, cx, cy, fontSize) {
    x.save();
    x.font = `bold ${fontSize}px "DM Mono", monospace`;
    x.textAlign = 'center';
    x.textBaseline = 'middle';

    const metrics = x.measureText(text);
    const tw = metrics.width;
    const padX = 14;
    const padY = 6;
    const bw = tw + padX * 2;
    const bh = fontSize + padY * 2;

    // Semi-translucent dark katazome seal capsule for ultra-crisp legibility over cloth fibers
    x.fillStyle = 'rgba(10, 22, 38, 0.72)';
    roundRect(x, cx - bw / 2, cy - bh / 2, bw, bh, 6);
    x.fill();

    x.strokeStyle = 'rgba(243, 236, 224, 0.35)';
    x.lineWidth = 1.2;
    roundRect(x, cx - bw / 2, cy - bh / 2, bw, bh, 6);
    x.stroke();

    // Crisp warm cream handle text
    x.fillStyle = '#f3ece0';
    x.fillText(text, cx, cy + 0.5);
    x.restore();
  }

  function makeClothCanvas() {
    const s = surface(TW, TH), x = s.ctx;

    const g = x.createLinearGradient(0, 0, 0, TH);
    g.addColorStop(0, '#284a6c');
    g.addColorStop(0.42, '#203d5e');
    g.addColorStop(1, '#17304e');
    x.fillStyle = g; x.fillRect(0, 0, TW, TH);

    const cloud = rng(4471);
    for (let i = 0; i < 26; i++) {
      const cx = cloud() * TW, cy = cloud() * TH, r = 120 + cloud() * 320;
      const light = cloud() > 0.5;
      const rg = x.createRadialGradient(cx, cy, 0, cx, cy, r);
      rg.addColorStop(0, light ? 'rgba(96,132,168,0.13)' : 'rgba(9,22,40,0.16)');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = rg; x.fillRect(cx - r, cy - r, r * 2, r * 2);
    }

    // Laid and chain lines
    x.strokeStyle = 'rgba(180,205,228,0.045)';
    x.lineWidth = 1;
    for (let px = 0; px < TW; px += 4) { x.beginPath(); x.moveTo(px + 0.5, 0); x.lineTo(px + 0.5, TH); x.stroke(); }
    x.strokeStyle = 'rgba(196,218,238,0.10)';
    x.lineWidth = 2;
    for (let py = 26; py < TH; py += 38) { x.beginPath(); x.moveTo(0, py + 0.5); x.lineTo(TW, py + 0.5); x.stroke(); }

    // Kozo fibres
    const fib = rng(90210);
    for (let i = 0; i < 2200; i++) {
      const fx = fib() * TW, fy = fib() * TH;
      const len = 30 + fib() * 150;
      const ang = (fib() - 0.5) * 0.9 + (fib() > 0.82 ? Math.PI / 2 : 0);
      const bow = (fib() - 0.5) * 26;
      const pale = fib();
      x.strokeStyle = pale > 0.3
        ? 'rgba(214,232,247,' + (0.022 + fib() * 0.048) + ')'
        : 'rgba(10,20,36,' + (0.04 + fib() * 0.07) + ')';
      x.lineWidth = 0.7 + fib() * 1.9;
      x.beginPath();
      x.moveTo(fx, fy);
      x.quadraticCurveTo(
        fx + Math.cos(ang) * len * 0.5 + bow, fy + Math.sin(ang) * len * 0.5 - bow,
        fx + Math.cos(ang) * len, fy + Math.sin(ang) * len,
      );
      x.stroke();
    }

    // Katazome frame inside each panel
    const panelW = TW / PANELS;
    x.strokeStyle = 'rgba(243,236,224,0.72)';
    for (let k = 0; k < PANELS; k++) {
      const x0 = k * panelW + 34, w = panelW - 68;
      x.lineWidth = 5;
      x.strokeRect(x0, TH * BAND + 34, w, TH - TH * BAND - 118);
      x.lineWidth = 2;
      x.strokeRect(x0 + 13, TH * BAND + 47, w - 26, TH - TH * BAND - 144);
    }

    // Sleeve
    x.fillStyle = 'rgba(8,18,34,0.30)';
    x.fillRect(0, 0, TW, TH * BAND);
    const sh = x.createLinearGradient(0, TH * BAND, 0, TH * BAND + 54);
    sh.addColorStop(0, 'rgba(6,14,28,0.42)');
    sh.addColorStop(1, 'rgba(6,14,28,0)');
    x.fillStyle = sh; x.fillRect(0, TH * BAND, TW, 54);
    x.strokeStyle = 'rgba(243,236,224,0.5)';
    x.lineWidth = 2.5;
    x.beginPath(); x.moveTo(0, TH * BAND); x.lineTo(TW, TH * BAND); x.stroke();

    // ---------------- PANEL 0 (LEFT): LINKEDIN ----------------
    x.fillStyle = 'rgba(243,236,224,0.7)';
    x.font = 'bold 22px Georgia, serif';
    x.textAlign = 'center';
    x.fillText('CH 01 // 接続', panelW * 0.5, TH * 0.22);

    drawLinkedInCrest(x, panelW * 0.5, TH * 0.33, 70);

    // Handle placed directly under logo, between logo end and vertical word start
    drawHandleBadge(x, 'ozanardaozcelik', panelW * 0.5, 442, 17);

    x.fillStyle = '#f3ece0';
    verticalWord(x, 'LINKEDIN', panelW * 0.5, 514, 46, 54);

    // ---------------- PANEL 1 (CENTER): EMAIL ----------------
    x.fillStyle = 'rgba(243,236,224,0.7)';
    x.font = 'bold 22px Georgia, serif';
    x.fillText('CH 02 // 連絡', panelW * 1.5, TH * 0.22);

    drawMailCrest(x, panelW * 1.5, TH * 0.33, 70);

    // Handle placed directly under logo, between logo end and vertical word start
    drawHandleBadge(x, 'ozan.a.ozcelik@gmail.com', panelW * 1.5, 442, 15);

    x.fillStyle = '#f3ece0';
    verticalWord(x, 'EMAIL', panelW * 1.5, 514, 48, 58);

    // Vermilion seal stamped at foot of center panel
    const S = 84, sx = panelW * 1.5 - S / 2, sy = TH * 0.81;
    x.fillStyle = '#a8342a';
    x.fillRect(sx, sy, S, S);
    x.strokeStyle = '#f3ece0';
    x.lineWidth = 4;
    x.strokeRect(sx + 10, sy + 10, S - 20, S - 20);
    x.fillStyle = '#f3ece0';
    for (let k = 0; k < 3; k++) x.fillRect(sx + 20 + k * 16, sy + 20, 7, S - 40);
    x.fillRect(sx + 20, sy + 34, S - 40, 7);
    x.fillRect(sx + 20, sy + 54, S - 40, 7);

    // ---------------- PANEL 2 (RIGHT): GITHUB ----------------
    x.fillStyle = 'rgba(243,236,224,0.7)';
    x.font = 'bold 22px Georgia, serif';
    x.textAlign = 'center';
    x.fillText('CH 03 // 開発', panelW * 2.5, TH * 0.22);

    drawGitHubCrest(x, panelW * 2.5, TH * 0.33, 70);

    // Handle placed directly under logo, between logo end and vertical word start
    drawHandleBadge(x, 'ozanardaozcelik', panelW * 2.5, 442, 17);

    x.fillStyle = '#f3ece0';
    verticalWord(x, 'GITHUB', panelW * 2.5, 514, 46, 54);

    return s;
  }

  function makeWoodTexture() {
    const W = 512, H = 96, s = surface(W, H), x = s.ctx;
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#a1764a');
    g.addColorStop(0.45, '#7d5533');
    g.addColorStop(1, '#563820');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const grain = rng(3312);
    for (let i = 0; i < 160; i++) {
      const y = grain() * H;
      x.strokeStyle = 'rgba(28,17,8,' + (0.05 + grain() * 0.16) + ')';
      x.lineWidth = 0.6 + grain() * 1.8;
      x.beginPath();
      x.moveTo(0, y);
      for (let px = 0; px <= W; px += 32) x.lineTo(px, y + Math.sin(px * 0.02 + i) * 2.4);
      x.stroke();
    }
    const tex = new THREE.CanvasTexture(s.canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.repeat.set(3, 1);
    return tex;
  }

  function makeShojiTexture() {
    const W = 768, H = 512, s = surface(W, H), x = s.ctx;
    x.fillStyle = '#140c06'; x.fillRect(0, 0, W, H);
    const glow = x.createRadialGradient(W * 0.5, H * 0.44, 0, W * 0.5, H * 0.44, W * 0.52);
    glow.addColorStop(0, '#ffdda4');
    glow.addColorStop(0.40, '#a97c42');
    glow.addColorStop(0.76, '#281508');
    glow.addColorStop(1, '#0e0703');
    x.fillStyle = glow; x.fillRect(0, 0, W, H);

    if ('filter' in x) x.filter = 'blur(7px)';
    x.strokeStyle = 'rgba(46,28,13,0.20)';
    x.lineWidth = 3;
    for (let px = 54; px < W; px += 128) { x.beginPath(); x.moveTo(px, 0); x.lineTo(px, H); x.stroke(); }
    for (let py = 46; py < H; py += 118) { x.beginPath(); x.moveTo(0, py); x.lineTo(W, py); x.stroke(); }
    if ('filter' in x) x.filter = 'none';
    const tex = new THREE.CanvasTexture(s.canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  /* ------------------------------------------------------------- scene -- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.24;

  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090705);

  const shoji = new THREE.Mesh(
    new THREE.PlaneGeometry(13, 8.4),
    new THREE.MeshBasicMaterial({ map: makeShojiTexture() }),
  );
  shoji.position.set(0, 0, -2.4);
  scene.add(shoji);

  const BW = 4.4, BH = 2.9;
  const GX = 60, GY = 40;
  const geo = new THREE.PlaneGeometry(BW, BH, GX, GY);

  const clothCanvas = makeClothCanvas();
  const albedo = new THREE.CanvasTexture(clothCanvas.canvas);
  albedo.colorSpace = THREE.SRGBColorSpace;
  const alphaMap = new THREE.CanvasTexture(makeAlphaMask().canvas);
  [albedo, alphaMap].forEach((t) => { t.anisotropy = maxAniso; });

  const mat = new THREE.MeshPhysicalMaterial({
    map: albedo,
    alphaMap,
    alphaTest: 0.5,
    transparent: false,
    side: THREE.DoubleSide,
    roughness: 0.92,
    metalness: 0.0,
    transmission: 0.82,
    thickness: 0.10,
    ior: 1.36,
    attenuationColor: new THREE.Color('#9dc0dd'),
    attenuationDistance: 3.0,
    sheen: 0.9,
    sheenColor: new THREE.Color('#d8e6f2'),
    sheenRoughness: 0.85,
  });

  const noren = new THREE.Mesh(geo, mat);
  scene.add(noren);

  /* ------------------------------------------------------------ fittings */
  const wood = new THREE.MeshStandardMaterial({ map: makeWoodTexture(), roughness: 0.66, metalness: 0.0 });
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, BW + 0.9, 20), wood);
  rod.rotation.z = Math.PI / 2;
  rod.position.set(0, BH / 2 + 0.045, 0.02);
  scene.add(rod);
  [-1, 1].forEach((side) => {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.082, 18, 12), wood);
    cap.position.set(side * (BW + 0.9) / 2, BH / 2 + 0.045, 0.02);
    scene.add(cap);
    const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 3.4, 8),
      new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: 0.9 }));
    cord.position.set(side * (BW + 0.72) / 2, BH / 2 + 1.75, 0.02);
    scene.add(cord);
  });

  /* ------------------------------------------------------------ lights -- */
  scene.add(new THREE.AmbientLight(0x4a3a28, 0.8));
  const lantern = new THREE.DirectionalLight(0xffd9a0, 3.6);
  lantern.position.set(-0.4, 0.9, -3.2); scene.add(lantern);
  const key = new THREE.DirectionalLight(0xffe9cc, 2.1);
  key.position.set(-2.6, 2.4, 2.6); scene.add(key);
  const fill = new THREE.DirectionalLight(0x94b6d8, 0.5);
  fill.position.set(3.0, -1.0, 2.0); scene.add(fill);

  /* ----------------------------------------------------------- physics -- */
  const pos = geo.attributes.position;
  const N = (GX + 1) * (GY + 1);
  const cur = new Float32Array(N * 3), prev = new Float32Array(N * 3), rest = new Float32Array(N * 3);
  const pinned = new Uint8Array(N);
  const idx = (ix, iy) => ix + iy * (GX + 1);

  for (let i = 0; i < N; i++) {
    const ax = pos.getX(i), ay = pos.getY(i);
    cur[i * 3] = prev[i * 3] = rest[i * 3] = ax;
    cur[i * 3 + 1] = prev[i * 3 + 1] = rest[i * 3 + 1] = ay;
    cur[i * 3 + 2] = prev[i * 3 + 2] = rest[i * 3 + 2] = 0;
  }
  for (let ix = 0; ix <= GX; ix++) pinned[ix] = 1;

  const BAND_ROWS = Math.round(GY * BAND);
  const SLIT_IX = SLIT_U.map((u) => Math.round(u * GX));
  const panelOf = (ix) => (ix < SLIT_IX[0] ? 0 : ix < SLIT_IX[1] ? 1 : 2);
  const linked = (ix, iy) => !(iy > BAND_ROWS && SLIT_IX.indexOf(ix + 1) !== -1);

  const restH = BW / GX, restV = BH / GY;
  const restD = Math.sqrt(restH * restH + restV * restV);
  const GRAV = -1.65, DAMP = 0.986, DT = 0.016;

  // Pointer interaction state
  let touchPoint = null;
  let pointerVelocity = new THREE.Vector3();
  let lastPointerPos = new THREE.Vector3();

  function wind(ix, iy, t) {
    const cx = ix / GX, cy = iy / GY;
    const ph = panelOf(ix) * 2.1;
    const gust = 0.40 + 0.28 * Math.sin(t * 0.37 + ph * 0.6) + 0.15 * Math.sin(t * 0.93 + ph);
    const travel = t * 1.2 - cy * 2.2 + ph;
    const amp = 1.5 * cy;
    let fz = (Math.sin(travel) + 0.35 * Math.sin(travel * 1.8 + cx * 3.4)) * amp * gust;
    let fx = Math.sin(t * 0.44 + ph) * 0.20 * cy;

    // Direct cursor / touch drag flutter
    if (touchPoint) {
      const px = cur[idx(ix, iy) * 3];
      const py = cur[idx(ix, iy) * 3 + 1];
      const dx = px - touchPoint.x;
      const dy = py - touchPoint.y;
      const distSq = dx * dx + dy * dy;
      if (distSq < 0.64) {
        const factor = Math.max(0, 1 - distSq / 0.64);
        fz += (pointerVelocity.z || 0.6) * factor * 2.5;
        fx += (pointerVelocity.x || 0.1) * factor * 1.8;
      }
    }

    return [fx, -0.18 * cy, fz];
  }

  function solve(a, b, rl) {
    const ax = cur[a * 3], ay = cur[a * 3 + 1], az = cur[a * 3 + 2];
    let dx = cur[b * 3] - ax, dy = cur[b * 3 + 1] - ay, dz = cur[b * 3 + 2] - az;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
    const diff = (d - rl) / d * 0.5;
    dx *= diff; dy *= diff; dz *= diff;
    const pa = pinned[a], pb = pinned[b];
    if (!pa && !pb) {
      cur[a * 3] += dx; cur[a * 3 + 1] += dy; cur[a * 3 + 2] += dz;
      cur[b * 3] -= dx; cur[b * 3 + 1] -= dy; cur[b * 3 + 2] -= dz;
    } else if (pa && !pb) { cur[b * 3] -= dx * 2; cur[b * 3 + 1] -= dy * 2; cur[b * 3 + 2] -= dz * 2; }
    else if (!pa && pb) { cur[a * 3] += dx * 2; cur[a * 3 + 1] += dy * 2; cur[a * 3 + 2] += dz * 2; }
  }

  function step(t) {
    for (let iy = 0; iy <= GY; iy++) {
      for (let ix = 0; ix <= GX; ix++) {
        const i = idx(ix, iy);
        if (pinned[i]) continue;
        const f = wind(ix, iy, t);
        for (let k = 0; k < 3; k++) {
          const j = i * 3 + k;
          const a = k === 0 ? f[0] : k === 1 ? f[1] + GRAV : f[2];
          const v = (cur[j] - prev[j]) * DAMP;
          prev[j] = cur[j];
          cur[j] = cur[j] + v + a * DT * DT;
        }
      }
    }
    for (let it = 0; it < 3; it++) {
      for (let iy = 0; iy <= GY; iy++) {
        for (let ix = 0; ix < GX; ix++) if (linked(ix, iy)) solve(idx(ix, iy), idx(ix + 1, iy), restH);
      }
      for (let iy = 0; iy < GY; iy++) {
        for (let ix = 0; ix <= GX; ix++) solve(idx(ix, iy), idx(ix, iy + 1), restV);
      }
      for (let iy = 0; iy < GY; iy++) {
        for (let ix = 0; ix < GX; ix++) {
          if (!linked(ix, iy) || !linked(ix, iy + 1)) continue;
          solve(idx(ix, iy), idx(ix + 1, iy + 1), restD);
          solve(idx(ix + 1, iy), idx(ix, iy + 1), restD);
        }
      }
    }
    for (let ix = 0; ix <= GX; ix++) {
      const i = ix;
      for (let k = 0; k < 3; k++) { cur[i * 3 + k] = rest[i * 3 + k]; prev[i * 3 + k] = rest[i * 3 + k]; }
    }
  }

  function commit() {
    for (let i = 0; i < N; i++) pos.setXYZ(i, cur[i * 3], cur[i * 3 + 1], cur[i * 3 + 2]);
    pos.needsUpdate = true;
    geo.computeVertexNormals();
  }

  /* --------------------------------------------------------------- fit -- */
  let camera;
  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    camera = new THREE.PerspectiveCamera(38, aspect, 0.1, 100);
    const vFit = (BH * 1.12 / 2) / Math.tan(38 * Math.PI / 360);
    const hFit = ((BW + 1.2) / 2) / Math.tan(38 * Math.PI / 360) / aspect;
    camera.position.set(0, 0.06, Math.max(vFit, hFit) * 1.02 + 0.3);
    camera.lookAt(0, -0.02, 0);
  }
  window.addEventListener('resize', fit);
  fit();

  /* ------------------------------------------------ Interactivity & Links */
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2(-999, -999);
  let activePanel = -1;

  const pillLinkedin = document.getElementById('pillLinkedin');
  const pillEmail = document.getElementById('pillEmail');
  const pillGithub = document.getElementById('pillGithub');

  function updatePillState(panelIdx) {
    activePanel = panelIdx;
    [pillLinkedin, pillEmail, pillGithub].forEach(p => {
      if (p) p.classList.remove('is-hovered', 'is-hovered-amber', 'is-hovered-green');
    });

    if (panelIdx === 0 && pillLinkedin) pillLinkedin.classList.add('is-hovered');
    if (panelIdx === 1 && pillEmail) pillEmail.classList.add('is-hovered-amber');
    if (panelIdx === 2 && pillGithub) pillGithub.classList.add('is-hovered-green');
  }

  function checkIntersection() {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObject(noren);
    if (hits.length > 0) {
      const uv = hits[0].uv;
      touchPoint = hits[0].point;
      const currentPos = hits[0].point.clone();
      pointerVelocity.subVectors(currentPos, lastPointerPos).multiplyScalar(15);
      lastPointerPos.copy(currentPos);

      let panel = -1;
      if (uv.x < 1/3) panel = 0;
      else if (uv.x < 2/3) panel = 1;
      else panel = 2;

      canvas.style.cursor = 'pointer';
      updatePillState(panel);
    } else {
      touchPoint = null;
      canvas.style.cursor = 'default';
      updatePillState(-1);
    }
  }

  window.addEventListener('pointermove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    checkIntersection();
  });

  window.addEventListener('pointerleave', () => {
    mouse.x = -999; mouse.y = -999;
    touchPoint = null;
    canvas.style.cursor = 'default';
    updatePillState(-1);
  });

  function triggerPanelAction(panel) {
    if (panel === 0) {
      window.open('https://www.linkedin.com/in/ozanardaozcelik/', '_blank');
    } else if (panel === 1) {
      window.location.href = 'mailto:ozan.a.ozcelik@gmail.com';
    } else if (panel === 2) {
      window.open('https://github.com/ozanardaozcelik', '_blank');
    }
  }

  canvas.addEventListener('click', () => {
    if (activePanel >= 0) {
      triggerPanelAction(activePanel);
    }
  });

  // Touch flutter support
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length > 0) {
      mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      checkIntersection();
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      checkIntersection();
    }
  }, { passive: true });

  /* ---------------------------------------------------------- animation -- */
  function draw(t) {
    camera.position.x = Math.sin(t * 0.1) * 0.20;
    camera.position.y = 0.06 + Math.sin(t * 0.14 + 1.1) * 0.07;
    camera.lookAt(0, -0.02, 0);
    renderer.render(scene, camera);
  }

  let running = false, raf = 0, t = 0;
  function loop() {
    if (!running) return;
    t += DT;
    step(t); commit(); draw(t);
    raf = requestAnimationFrame(loop);
  }
  function start() { if (running) return; running = true; raf = requestAnimationFrame(loop); }
  function stop() { running = false; cancelAnimationFrame(raf); }

  for (let s = 0; s < 180; s++) step(s * DT);
  t = 180 * DT;
  if (reduce) {
    commit(); draw(t);
  } else {
    start();
    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
  }

  // Synchronize language with parent page
  try {
    const pLang = (window.parent && window.parent.document && window.parent.document.documentElement.lang) || 'tr';
    document.documentElement.setAttribute('data-lang', pLang);
  } catch (e) {
    document.documentElement.setAttribute('data-lang', 'tr');
  }
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'SET_LANG' && (e.data.lang === 'tr' || e.data.lang === 'en')) {
      document.documentElement.setAttribute('data-lang', e.data.lang);
    }
  });
})();
</script>
</body>
</html>
